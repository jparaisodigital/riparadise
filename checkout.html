<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CHECKOUT — R.I.PARADISE</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    
    <header class="checkout-header">
        <a href="store.html" class="back-link">← Back to Shop</a>
        <a href="store.html" class="cart-link" aria-label="Cart">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span class="cart-count"></span>
        </a>
    </header>
    
    <main class="checkout-layout">
        
        <!-- LEFT: FORM -->
        <form id="checkout-form" novalidate>
            <h1 class="checkout-title">Checkout</h1>
            
            <section class="co-section">
                <h2 class="co-heading">Contact</h2>
                <input class="co-input" type="email" id="co-email" placeholder="Email" />
            </section>
            
            <section class="co-section">
                <h2 class="co-heading">Delivery</h2>
                <div class="co-row">
                    <input class="co-input" type="text" id="co-firstname" placeholder="First name" />
                    <input class="co-input" type="text" id="co-lastname" placeholder="Last name" />
                </div>
                <input class="co-input" type="text" id="co-address" placeholder="Address (street, barangay, city)" />
                <div id="co-region-wrap">
                    <select class="co-input" id="co-region">
                        <option value="" disabled selected>Select region</option>
                        <option value="luzon">Luzon</option>
                        <option value="visayas_mindanao">Visayas / Mindanao</option>
                    </select>
                </div>
                <div class="co-row">
                    <input class="co-input" type="tel" id="co-phone" placeholder="Phone number" />
                    <input class="co-input" type="text" id="co-postal" placeholder="Postal code (optional)" />
                </div>
            </section>
            
            <section class="co-section">
                <h2 class="co-heading">Shipping info</h2>
                <div class="co-delivery-info" id="co-delivery-info"></div>
            </section>
            
            <section class="co-section">
                <h2 class="co-heading">Payment</h2>
                <div class="co-payments" id="co-payments"></div>
                <div class="co-qr-box" id="co-qr-box" hidden>
                    <div class="co-qr-image" id="co-qr-image"></div>
                    <p class="co-qr-note" id="co-qr-note"></p>
                </div>
                <p class="co-cod-note" id="co-cod-note" hidden>
                    Same-day delivery via Lalamove or Grab Express. Pay in cash when your order arrives.
                </p>
            </section>
        </form>
        
        <!-- RIGHT: ORDER SUMMARY -->
        <aside class="co-summary">
            <div class="co-items" id="co-items"></div>
            <div class="co-totals">
                <div class="co-total-row">
                    <span>Subtotal</span>
                    <span id="co-subtotal">—</span>
                </div>
                <div class="co-total-row muted">
                    <span>Shipping</span>
                    <span id="co-shipping">Select region</span>
                </div>
                <div class="co-total-row total">
                    <span>Total</span>
                    <span id="co-total">—</span>
                </div>
            </div>
            <button class="co-place-order" id="co-place-order" type="button">Place Order</button>
        </aside>
        
    </main>
    
    <!-- ====================== -->
    <!-- ORDER SUCCESS OVERLAY  -->
    <!-- ====================== -->
    <div class="modal-overlay" id="order-success">
        <div class="modal success-modal">
            <button class="modal-close" id="order-success-close">×</button>
            <h2 class="modal-title">Order Received</h2>
            <div class="success-body">
                <p class="success-order-num" id="success-order-num"></p>
                <p class="success-total" id="success-total"></p>
                <div class="success-instructions" id="success-instructions"></div>
                <button type="button" class="co-place-order" id="success-messenger-btn" style="display:none; margin-bottom:16px;">Continue to Messenger</button>
                <a href="store.html" class="success-back-link no-transition" id="success-back-link">
                    <span class="back-text">Back to Shop</span>
                    <span class="back-line">
                        <span class="back-arrow">←</span>
                    </span>
                </a>
            </div>
        </div>
    </div>
    
    <script src="config.js"></script>
    <script src="cart.js"></script>
    <script src="app.js"></script>
    <script src="checkout.js"></script>
</body>
</html>
